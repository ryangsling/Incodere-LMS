# fly.toml app configuration file generated for ilms-api on 2026-07-20T14:58:09+06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ilms-api'
primary_region = 'sin'

[build]
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
